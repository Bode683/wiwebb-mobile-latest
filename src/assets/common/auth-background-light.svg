<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"
     preserveAspectRatio="xMidYMid slice">
  <!--
    Wiweeb — Mobile Background, LIGHT MODE
    Canvas : 390 × 844 px  (iPhone 14 / modern Android target)
    Responsive: viewBox scales from 360–768 px wide via preserveAspectRatio
    Sky    : daylight blue  #B8D9F0 → #E8F4FD
    Terrain: green family   #2E7D52 / #3A9E68 / #4CB87A
    Accents: brand orange   #F7941D
  -->

  <defs>
    <!-- Daylight sky gradient — deeper blue at top, pale near horizon -->
    <linearGradient id="skyLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7BC0E8"/>
      <stop offset="60%"  stop-color="#B8D9F0"/>
      <stop offset="100%" stop-color="#DAF0E8"/>
    </linearGradient>
  </defs>

  <!-- ── SKY ─────────────────────────────────── -->
  <rect width="390" height="844" fill="url(#skyLight)"/>


  <!-- ── CLOUDS ────────────────────────────────── -->

  <!-- Cloud 1 (left) -->
  <g opacity="0.92">
    <ellipse cx="110" cy="160" rx="52" ry="22" fill="#FFFFFF"/>
    <ellipse cx="80"  cy="170" rx="32" ry="18" fill="#FFFFFF"/>
    <ellipse cx="144" cy="170" rx="36" ry="17" fill="#FFFFFF"/>
    <ellipse cx="110" cy="178" rx="58" ry="14" fill="#FFFFFF"/>
  </g>

  <!-- Cloud 2 (upper right, smaller) -->
  <g opacity="0.80">
    <ellipse cx="316" cy="120" rx="44" ry="18" fill="#FFFFFF"/>
    <ellipse cx="290" cy="130" rx="28" ry="14" fill="#FFFFFF"/>
    <ellipse cx="344" cy="130" rx="30" ry="13" fill="#FFFFFF"/>
    <ellipse cx="316" cy="138" rx="48" ry="12" fill="#FFFFFF"/>
  </g>

  <!-- Cloud 3 (tiny, mid-left) -->
  <g opacity="0.55">
    <ellipse cx="48"  cy="230" rx="28" ry="11" fill="#FFFFFF"/>
    <ellipse cx="30"  cy="237" rx="18" ry="9"  fill="#FFFFFF"/>
    <ellipse cx="66"  cy="237" rx="20" ry="9"  fill="#FFFFFF"/>
    <ellipse cx="48"  cy="242" rx="30" ry="8"  fill="#FFFFFF"/>
  </g>


  <!-- ── TERRAIN back layer ────────────────────── -->
  <path fill="#2E7D52" d="
    M 0,640
    C 60,610 130,595 210,602
    C 290,609 340,628 390,618
    L 390,844 L 0,844 Z
  "/>

  <!-- ── TERRAIN mid layer ─────────────────────── -->
  <path fill="#3A9E68" d="
    M 0,672
    C 70,648 150,632 240,642
    C 310,650 355,668 390,658
    L 390,844 L 0,844 Z
  "/>

  <!-- ── TERRAIN front layer ───────────────────── -->
  <path fill="#4CB87A" d="
    M 0,695
    C 55,672 130,656 220,665
    C 300,673 350,690 390,680
    L 390,844 L 0,844 Z
  "/>

  <!-- ── TERRAIN highlight rim ─────────────────── -->
  <path fill="#6ED49A" opacity="0.50" d="
    M 0,695
    C 55,672 130,656 220,665
    C 300,673 350,690 390,680
    L 390,692
    C 350,702 300,686 220,678
    C 130,669 55,685 0,708 Z
  "/>


  <!-- ── TREES — bottom left ───────────────────── -->
  <!-- Tree 1 -->
  <g transform="translate(68, 652)">
    <rect x="-4" y="32" width="8" height="28" rx="3" fill="#5C3D1E"/>
    <ellipse cx="0" cy="16"  rx="22" ry="26" fill="#2E7D52"/>
    <ellipse cx="0" cy="8"   rx="17" ry="20" fill="#3A9E68"/>
    <ellipse cx="0" cy="2"   rx="11" ry="13" fill="#4CB87A"/>
  </g>

  <!-- Tree 2 -->
  <g transform="translate(108, 660)">
    <rect x="-4" y="28" width="8" height="24" rx="3" fill="#5C3D1E"/>
    <ellipse cx="0" cy="14"  rx="19" ry="22" fill="#2E7D52"/>
    <ellipse cx="0" cy="7"   rx="14" ry="17" fill="#3A9E68"/>
    <ellipse cx="0" cy="1"   rx="9"  ry="11" fill="#4CB87A"/>
  </g>


  <!-- ── BUILDINGS — bottom right ──────────────── -->

  <!-- Building 1 — tall back -->
  <g transform="translate(272, 524)">
    <rect x="0" y="0" width="52" height="188" rx="3" fill="#2C3E50"/>
    <rect x="6"  y="12" width="10" height="8" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="22" y="12" width="10" height="8" rx="2" fill="#F7941D" opacity="0.4"/>
    <rect x="36" y="12" width="10" height="8" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="6"  y="28" width="10" height="8" rx="2" fill="#F7941D" opacity="0.3"/>
    <rect x="22" y="28" width="10" height="8" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="36" y="28" width="10" height="8" rx="2" fill="#F7941D" opacity="0.5"/>
    <rect x="6"  y="44" width="10" height="8" rx="2" fill="#F7941D" opacity="0.6"/>
    <rect x="22" y="44" width="10" height="8" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="36" y="44" width="10" height="8" rx="2" fill="#F7941D" opacity="0.3"/>
    <rect x="6"  y="60" width="10" height="8" rx="2" fill="#F7941D" opacity="0.5"/>
    <rect x="22" y="60" width="10" height="8" rx="2" fill="#F7941D" opacity="0.4"/>
    <rect x="36" y="60" width="10" height="8" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="0"  y="0"  width="52" height="3" rx="1" fill="#F7941D" opacity="0.5"/>
  </g>

  <!-- Building 2 — mid -->
  <g transform="translate(210, 560)">
    <rect x="0" y="0" width="56" height="152" rx="3" fill="#34495E"/>
    <rect x="6"  y="12" width="12" height="9" rx="2" fill="#F7941D" opacity="0.6"/>
    <rect x="24" y="12" width="12" height="9" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="38" y="12" width="12" height="9" rx="2" fill="#F7941D" opacity="0.4"/>
    <rect x="6"  y="30" width="12" height="9" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="24" y="30" width="12" height="9" rx="2" fill="#F7941D" opacity="0.3"/>
    <rect x="38" y="30" width="12" height="9" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="6"  y="48" width="12" height="9" rx="2" fill="#F7941D" opacity="0.5"/>
    <rect x="24" y="48" width="12" height="9" rx="2" fill="#F7941D" opacity="0.6"/>
    <rect x="38" y="48" width="12" height="9" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="0"  y="0"  width="56" height="3" rx="1" fill="#F7941D" opacity="0.4"/>
  </g>

  <!-- Building 3 — short front-left -->
  <g transform="translate(330, 572)">
    <rect x="0" y="0" width="44" height="140" rx="3" fill="#2C3E50"/>
    <rect x="5"  y="10" width="10" height="8" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="20" y="10" width="10" height="8" rx="2" fill="#F7941D" opacity="0.4"/>
    <rect x="30" y="10" width="10" height="8" rx="2" fill="#F7941D" opacity="0.8"/>
    <rect x="5"  y="26" width="10" height="8" rx="2" fill="#F7941D" opacity="0.3"/>
    <rect x="20" y="26" width="10" height="8" rx="2" fill="#F7941D" opacity="0.7"/>
    <rect x="30" y="26" width="10" height="8" rx="2" fill="#F7941D" opacity="0.5"/>
    <rect x="0"  y="0"  width="44" height="3" rx="1" fill="#F7941D" opacity="0.4"/>
  </g>


  <!-- ── WIFI ICONS above buildings ────────────── -->

  <!-- Main wifi -->
  <g transform="translate(298, 500)" opacity="0.90">
    <circle cx="0" cy="0" r="4.5" fill="#F7941D"/>
    <path d="M -11,-12 A 12,12 0 0 1 11,-12" stroke="#F7941D" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M -20,-23 A 22,22 0 0 1 20,-23" stroke="#F7941D" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Small wifi -->
  <g transform="translate(238, 536)" opacity="0.65">
    <circle cx="0" cy="0" r="3.5" fill="#F7941D"/>
    <path d="M -8,-9 A 9,9 0 0 1 8,-9"       stroke="#F7941D" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M -15,-17 A 16,16 0 0 1 15,-17"  stroke="#F7941D" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>


  <!-- ── SIGNAL RINGS (decorative) ─────────────── -->
  <circle cx="298" cy="500" r="40"  fill="none" stroke="#F7941D" stroke-width="1"   opacity="0.12"/>
  <circle cx="298" cy="500" r="66"  fill="none" stroke="#F7941D" stroke-width="0.8" opacity="0.07"/>
  <circle cx="298" cy="500" r="95"  fill="none" stroke="#F7941D" stroke-width="0.8" opacity="0.04"/>

</svg>
