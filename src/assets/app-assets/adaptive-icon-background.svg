<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Wiweeb — Adaptive Icon BACKGROUND layer
    Canvas  : 1024 × 1024 px
    Use     : Android adaptive icon background (must be 108dp × 108dp, full bleed)
    BG      : Brand orange #F7941D (solid — safe for all launcher shapes)
  -->

  <rect width="1024" height="1024" fill="#F7941D"/>

  <!-- Subtle radial warmth -->
  <radialGradient id="warmth" cx="50%" cy="50%" r="55%">
    <stop offset="0%"  stop-color="#FFAA40" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#F7941D" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#warmth)"/>

</svg>
