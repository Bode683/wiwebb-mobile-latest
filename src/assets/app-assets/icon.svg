<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    wiwebb — App Launcher Icon
    Canvas  : 1024 × 1024 px
    Content : "w-i-w" letters + wifi signal above the i (from the brand logo)
    BG      : Brand orange #F7941D
    Fg      : White — exact traced paths from wiwebb-orange.svg

    The logo has TWO separate letter paths that together spell "wiw":
      Path 1 (w+i+w left): x 249 → ~740,  y 1007 → 1238
        — This is the left w, the i, and the letter body connecting to right w
        — Actually on review: this path IS the full left-w + i + right-w compound
        — BUT the second path (x 713→1050) is labelled "w (second)" in the SVG
        — So together they form: [left-w] + [i] + [w] + [second-w] = "wiww"?
        — No — looking at the logo: it reads "wiwebb". The "wiw" prefix is:
            left-w (x~249-415), i (x~597-668), right-w (x~713-1020)
        — Path 1 contains: left-w + i + first-right-w as one compound path
        — Path 2 contains: the second w (rightmost of the "wiw")
        — BOTH paths are needed to spell "wiw"

    Bounding box of BOTH letter paths + wifi:
      Path 1  x: 249 → 1020   y: 1007 → 1238
      Path 2  x: 713 → 1050   y: 1013 → 1238
      Wifi    x: 457 → 820    y:  712 →  982
      Combined: x 249 → 1050,  y 712 → 1238
        width  = 801
        height = 526
      Centre: cx = (249+1050)/2 = 649.5,  cy = (712+1238)/2 = 975

    Square viewBox — side 960 with ~14% padding:
      vbX = 649.5 - 480 = 169.5 → 170
      vbY = 975   - 480 = 495
    → viewBox="170 495 960 960"   (same as before, now with Path 2 included)
  -->

  <!-- ── BACKGROUND ────────────────────────────── -->
  <rect width="1024" height="1024" fill="#F7941D"/>

  <!-- Subtle radial depth -->
  <radialGradient id="depth" cx="50%" cy="44%" r="58%">
    <stop offset="0%"   stop-color="#FFAA40" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#C86A00" stop-opacity="0.18"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#depth)"/>

  <!--
    transform: viewBox "170 495 960 960" → canvas 1024×1024
    scale = 1024/960 ≈ 1.0667
    Combined: scale(1.0667) translate(-170, -495)
  -->
